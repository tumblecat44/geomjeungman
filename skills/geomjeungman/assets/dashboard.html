<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>검증 관제탑</title>
<style>
:root {
  color-scheme: light;
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Segoe UI", sans-serif;
  --ink: #202124;
  --muted: #62666d;
  --line: #e8e9eb;
  --paper: #fff;
  --canvas: #f8f9fa;
  --accent: #23665e;
  --accent-soft: #eaf4f1;
  --accent-line: #d0e5df;
  --ease-out: cubic-bezier(.23,1,.32,1);
  --sengi-cursor: url("data:image/svg+xml;base64,__GEOMJEUNG_CURSOR__") 3 10;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; height: 100dvh; min-height: 420px; display: grid; grid-template-rows: 56px minmax(0, 1fr); color: var(--ink); background: var(--paper); cursor: var(--sengi-cursor), auto; }
button, a { font: inherit; color: inherit; }
button { cursor: pointer; background: none; border: 0; border-radius: 7px; }
button:disabled { cursor: default; }
button:focus-visible, a:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
button:active:not(:disabled) { transform: scale(.96); }
a { text-decoration: none; }
a:hover { text-decoration: underline; }
.top { padding: 0 24px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; }
.brand { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 750; letter-spacing: -.045em; white-space: nowrap; }
.brand-mark { width: 22px; height: 22px; flex: none; background: var(--accent); color: white; border-radius: 6px; }
.brand-eye { fill: var(--accent); }
.project { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; border-left: 1px solid var(--line); padding-left: 12px; color: var(--muted); font-size: 12px; }
.layout { min-height: 0; display: grid; grid-template-columns: clamp(225px, 22vw, 280px) minmax(0, 1fr); }
aside { min-height: 0; border-right: 1px solid var(--line); display: flex; flex-direction: column; }
.calendar { padding: 21px 16px 14px; border-bottom: 1px solid var(--line); }
.month-bar { display: flex; align-items: center; gap: 3px; padding: 0 2px 10px; }
.month-bar h2 { font-size: 14px; margin: 0 auto 0 0; font-weight: 700; }
.icon-btn { width: 32px; height: 32px; display: inline-grid; place-items: center; font-size: 18px; line-height: 1; }
.icon-btn:hover, .secondary:hover { background: #f0f1f3; }
.days { display: grid; grid-template-columns: repeat(7,minmax(0,1fr)); gap: 3px; text-align: center; }
.weekday { color: var(--muted); font-size: 11px; padding-bottom: 5px; }
.day { aspect-ratio: 1; min-width: 0; padding: 0; font-size: 12px; font-variant-numeric: tabular-nums; position: relative; }
.day:disabled { color: #868990; }
.day.available { font-weight: 700; }
.day.available::after { content: ""; position: absolute; left: calc(50% - 2px); bottom: 3px; width: 4px; height: 4px; border-radius: 50%; background: var(--accent); }
.day.available:hover { background: var(--accent-soft); }
.day[aria-pressed="true"], .day[aria-pressed="true"]:hover { color: #fff; background: var(--accent); }
.day[aria-pressed="true"]::after { background: var(--accent-line); }
.runs { overflow: auto; padding: 14px 12px; }
.list-head { padding: 5px 7px 9px; color: var(--muted); font-size: 12px; display: flex; justify-content: space-between; gap: 8px; }
.run { width: 100%; display: grid; grid-template-columns: 1fr auto; gap: 7px; align-items: center; padding: 10px 9px; text-align: left; border: 1px solid transparent; }
.run:hover { background: #f6f6f7; }
.run[aria-current="true"] { background: var(--accent-soft); border-color: var(--accent-line); }
.run-name { min-width: 0; overflow-wrap: anywhere; font-weight: 600; font-size: 13px; }
.run-count { color: var(--muted); font-size: 11px; white-space: nowrap; }
main { min-width: 0; min-height: 0; display: grid; grid-template-rows: auto minmax(0,1fr); }
.toolbar { min-height: 70px; padding: 13px 22px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.run-heading { min-width: 0; flex: 1; }
.run-heading h1 { margin: 0; font-size: 17px; font-weight: 720; letter-spacing: -.035em; overflow-wrap: anywhere; }
.run-meta { margin: 2px 0 0; color: var(--muted); font: 11px/1.4 ui-monospace, monospace; }
.secondary { height: 33px; padding: 0 10px; border: 1px solid var(--line); background: var(--paper); font-size: 12px; white-space: nowrap; }
.viewport { min-height: 0; position: relative; display: grid; place-items: center; overflow: hidden; isolation: isolate; touch-action: none; user-select: none; cursor: var(--sengi-cursor), grab; background: var(--canvas); }
.viewport.moving { cursor: var(--sengi-cursor), grabbing; }
.world { position:absolute; top:0; left:0; width:0; height:0; transform-origin: 0 0; }
.grid { position: absolute; inset: 0; pointer-events: none; background-image: radial-gradient(#dce0e5 .7px, transparent .7px); }
.shot { position:absolute; top:0; left:0; margin:0; background: var(--paper); padding:7px; border:1px solid #dbdde0; border-radius:10px; box-shadow: 0 1px 3px #181c2510, 0 4px 12px #181c2508; }
.shot-media { display:grid; place-items:center; height:var(--shot-height); border-radius:5px; background:#f1f2f3; }
.shot-surface { position:relative; width:var(--image-width); height:100%; }
.shot img { display:block; width:100%; height:100%; border-radius:5px; object-fit:contain; pointer-events:none; }
.shot figcaption { min-height:31px; display:flex; align-items:end; gap:7px; padding:0 2px 3px; white-space: nowrap; }
.shot .size { font: 600 12px/1.4 ui-monospace,monospace; }
.shot .issue { color: #77500b; font-size: 11px; }
.shot a { margin-left:auto; color:var(--muted); font-size: 11px; cursor: pointer; }
.shot-action { min-height:30px; margin:5px 2px 0; padding:0 8px; border:1px solid var(--line); font-size:11px; }
.shot-action:hover { background:#f0f1f3; }
.shot.generated { border-color:#ef995b; background:#fff2e7; }
.generated .issue { color:#9c3b12; font-weight:700; }
.overlays { position:absolute; inset:0; pointer-events:none; }
.hotspot { position:absolute; min-width:0; padding:0; pointer-events:auto; cursor:pointer; border:2px solid #e1323d; border-radius:2px; box-shadow:0 0 0 1px #fff; }
.hotspot:hover, .hotspot:focus-visible { background:#e1323d24; }
.hotspot span { position:absolute; top:-8px; left:-8px; background:#c5232e; color:white; border-radius:50%; font-size:10px; line-height:15px; min-width:15px; padding:0 2px; }
.issue-tip { position:fixed; z-index:5; width:max-content; max-width:min(320px, calc(100vw - 24px)); padding:10px 12px; color:#202124; background:#fff; border:1px solid var(--line); border-radius:8px; box-shadow:0 3px 18px #20212424; pointer-events:none; overflow-wrap:anywhere; }
.issue-tip p { margin:5px 0 0; font-size:12px; }
.empty { z-index: 1; text-align: center; max-width: 330px; margin: 22px; padding: 15px 23px; border: 1px solid var(--line); border-radius: 10px; background: var(--paper); cursor: default; }
.empty strong { font-size: 15px; }
.empty p { margin: 5px 0 0; color: var(--muted); overflow-wrap: anywhere; }
.canvas-bar { position:absolute; z-index:2; bottom:16px; right:16px; display:flex; align-items:center; gap:2px; padding:3px; background:var(--paper); border:1px solid var(--line); border-radius:9px; box-shadow:0 2px 6px #2221; cursor:auto; }
.zoom { min-width: 51px; text-align: center; color:var(--muted); font: 11px ui-monospace,monospace; }
.fit { margin-left:4px; border-left:1px solid var(--line); border-radius:0 6px 6px 0; }
dialog { width:min(580px, 92vw); max-height: 82dvh; background: var(--paper); color: var(--ink); border:1px solid var(--line); border-radius:12px; padding: 21px; box-shadow:0 14px 60px #17171724; }
dialog::backdrop { background:#2425294d; }
.dialog-head { display:flex; align-items:center; justify-content:space-between; gap:10px; }
.dialog-head h2 { margin:0; font-size:16px; overflow-wrap:anywhere; }
.links { display:flex; gap:15px; color:var(--accent); }
.notes { white-space:pre-wrap; overflow-wrap:anywhere; font-size:13px; line-height:1.65; }
.proposal-list { padding-left:22px; }
.proposal-list p { margin:3px 0 10px; color:var(--muted); overflow-wrap:anywhere; }
.proposal-actions { display:flex; align-items:center; flex-wrap:wrap; gap:10px; }
.proposal-status { color:var(--muted); font-size:12px; }
#fix-text { margin-top:10px; width:100%; min-height:85px; resize:vertical; font:inherit; }
@media (max-width: 650px) {
  .top { padding: 0 14px; }
  .layout { grid-template-columns: minmax(0,1fr); grid-template-rows: min(37dvh, 210px) minmax(0,1fr); }
  aside { flex-direction: row; border-right:0; border-bottom:1px solid var(--line); }
  .calendar { flex: 0 0 min(50vw, 203px); border-bottom:0; border-right:1px solid var(--line); padding:5px 8px; overflow:auto; }
  .month-bar { padding-bottom:2px; }
  .month-bar h2 { font-size:12px; }
  .days { gap:1px; }
  .day { aspect-ratio: auto; height:22px; }
  .runs { flex:1; min-width:0; padding:5px; }
  .run { padding:6px; }
  .run-name { font-size:12px; }
  .run-count { display:none; }
  .toolbar { min-height:55px; padding:8px 10px; gap:5px; }
  .run-heading h1 { font-size:14px; }
  .secondary { padding:0 6px; }
}
@media (prefers-reduced-motion: no-preference) and (pointer: fine) {
  button { transition: transform 120ms var(--ease-out); }
}
@media (prefers-reduced-motion: reduce) {
  button:active:not(:disabled) { transform:none; }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
      <path d="M17 14.6c2.1 0 4.4.6 4.4 2.2 0 .9-.8 1.3-1.6 1.2" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
      <path d="M3 13.2 7.7 10.5l.9-1c-.3-2.1 2.2-2.6 3.2-.7 3.6-.5 6.9 1.7 7.1 4.4.2 1.8-.8 3-2.5 3.4H8.7c-1.7 0-2.7-1-3.3-2.1L3 13.2Z" fill="currentColor" stroke="currentColor" stroke-width="1.1" stroke-linejoin="round"/>
      <circle class="brand-eye" cx="9" cy="11.9" r=".95"/>
    </svg>
    검증 관제탑
  </div>
  <span class="project" id="project"></span>
</header>
<div class="layout">
  <aside aria-label="검사 기록 탐색">
    <div class="calendar">
      <div class="month-bar"><h2 id="month"></h2><button class="icon-btn" id="prev" aria-label="이전 달">‹</button><button class="icon-btn" id="next" aria-label="다음 달">›</button></div>
      <div id="calendar" class="days"></div>
    </div>
    <nav class="runs" aria-label="선택 날짜의 검사">
      <div class="list-head"><span id="day-label">검사 기록</span><span id="run-count"></span></div>
      <div id="runs"></div>
    </nav>
  </aside>
  <main>
    <div class="toolbar">
      <div class="run-heading"><h1 id="run-title">검사 기록</h1><p id="meta" class="run-meta"></p></div>
      <button class="secondary" id="toggle-marked" hidden>원본 보기</button>
      <button class="secondary" id="show-notes" hidden>검사 기록</button>
    </div>
    <section class="viewport" id="viewport" aria-label="스크린샷 캔버스" tabindex="0">
      <div class="grid" id="grid" aria-hidden="true"></div>
      <div class="world" id="world"></div>
      <div class="empty" id="empty" hidden><strong id="empty-title"></strong><p id="empty-detail"></p></div>
      <div class="canvas-bar" id="canvas-bar" hidden>
        <button id="zoom-out" class="icon-btn" aria-label="축소">−</button>
        <output class="zoom" id="zoom" aria-label="확대 비율">100%</output>
        <button id="zoom-in" class="icon-btn" aria-label="확대">+</button>
        <button id="fit" class="icon-btn fit" aria-label="전체 화면에 맞추기" title="전체 화면에 맞추기">⛶</button>
      </div>
    </section>
  </main>
</div>
<dialog id="notes">
  <div class="dialog-head"><h2>검사 기록</h2><form method="dialog"><button class="icon-btn" aria-label="닫기">×</button></form></div>
  <p class="links"><a id="report" target="_blank" rel="noopener" hidden>측정값 JSON ↗</a><a id="findings" target="_blank" rel="noopener" hidden>findings.md ↗</a></p>
  <div class="notes" id="notes-text"></div>
</dialog>
<div class="issue-tip" id="issue-tip" role="tooltip" hidden><strong id="issue-problem"></strong><p id="issue-suggestion"></p></div>
<dialog id="proposals">
  <div class="dialog-head"><h2>모든 제안 반영 미리보기</h2><form method="dialog"><button class="icon-btn" aria-label="닫기">×</button></form></div>
  <ol class="proposal-list" id="proposal-list"></ol>
  <div class="proposal-actions">
    <button class="secondary" id="generate-preview">이미지 생성</button>
    <button class="secondary" id="copy-fixes" hidden>수정 요청 복사</button>
    <span class="proposal-status" id="proposal-status" role="status"></span>
  </div>
  <textarea id="fix-text" readonly hidden aria-label="수정 요청"></textarea>
</dialog>
<script id="geomjeung-data" type="application/json">__GEOMJEUNG_DATA__</script>
<script>
const $ = (id) => document.getElementById(id);
const { project, selected, runs, previewEnabled } = JSON.parse($('geomjeung-data').textContent);
const grouped = new Map();
for (const run of runs) {
  if (!grouped.has(run.day)) grouped.set(run.day, []);
  grouped.get(run.day).push(run);
}
const viewport = $('viewport');
const world = $('world');
const grid = $('grid');
const key = 'geomjeung-positions-v1';
const saved = new Map();
let run = runs.find(item => item.id === selected) || runs[0];
let day = run?.day;
const initialDate = day ? new Date(day + 'T12:00:00') : new Date();
let month = new Date(initialDate.getFullYear(), initialDate.getMonth(), 1, 12);
let cards = [];
let camera = { x: 0, y: 0, scale: 1 };
let drag = null;
let markedMode = true;
let layer = 0;
let proposalShot = null;
const pendingPreviews = new Set();

function hideIssue() { $('issue-tip').hidden = true; }
function showIssue(marker, issue) {
  if (drag) return;
  $('issue-problem').textContent = issue.problem;
  $('issue-suggestion').textContent = issue.suggestion;
  const tip = $('issue-tip');
  tip.hidden = false;
  const box = marker.getBoundingClientRect();
  const left = Math.max(12, Math.min(box.left, innerWidth - tip.offsetWidth - 12));
  const top = box.bottom + tip.offsetHeight + 20 < innerHeight ? box.bottom + 8 : box.top - tip.offsetHeight - 8;
  tip.style.left = `${left}px`;
  tip.style.top = `${Math.max(12, top)}px`;
}

function readPositions() {
  if (saved.has(run.id)) return saved.get(run.id);
  try { return JSON.parse(localStorage.getItem(key + ':' + run.id) || '{}'); }
  catch { return {}; }
}
function savePositions() {
  const positions = Object.fromEntries(cards.map(card => [card.shot.src, [card.x, card.y]]));
  saved.set(run.id, positions);
  try { localStorage.setItem(key + ':' + run.id, JSON.stringify(positions)); } catch {}
}

function calendar() {
  const year = month.getFullYear(), number = month.getMonth();
  $('month').textContent = `${year}년 ${number + 1}월`;
  const panel = $('calendar');
  panel.replaceChildren();
  for (const label of '일월화수목금토') {
    const node = document.createElement('span');
    node.className = 'weekday';
    node.textContent = label;
    panel.append(node);
  }
  for (let pad = 0; pad < month.getDay(); pad++) panel.append(document.createElement('span'));
  const end = new Date(year, number + 1, 0).getDate();
  for (let value = 1; value <= end; value++) {
    const iso = `${year}-${String(number + 1).padStart(2, '0')}-${String(value).padStart(2, '0')}`;
    const onDay = grouped.get(iso) || [];
    const button = document.createElement('button');
    button.className = 'day' + (onDay.length ? ' available' : '');
    button.textContent = value;
    button.disabled = !onDay.length;
    button.setAttribute('aria-label', `${iso}, 검사 ${onDay.length}건`);
    if (onDay.length) button.setAttribute('aria-pressed', String(iso === day));
    button.onclick = () => {
      select(onDay[0]);
      panel.querySelector('[aria-pressed="true"]')?.focus();
    };
    panel.append(button);
  }
}

function list() {
  $('day-label').textContent = day || '검사 기록';
  const entries = grouped.get(day) || [];
  $('run-count').textContent = `${entries.length}건`;
  const list = $('runs');
  list.replaceChildren();
  for (const item of entries) {
    const button = document.createElement('button');
    const name = document.createElement('span');
    const count = document.createElement('span');
    name.className = 'run-name';
    name.textContent = item.title;
    count.className = 'run-count';
    count.textContent = `${item.shots.length}장`;
    button.className = 'run';
    button.setAttribute('aria-current', String(item.id === run?.id));
    button.append(name, count);
    button.onclick = () => { select(item); list.querySelector('[aria-current="true"]')?.focus(); };
    list.append(button);
  }
}

function position(card) {
  card.node.style.transform = `translate(${card.x}px, ${card.y}px)`;
}

function updateCamera() {
  hideIssue();
  const { x, y, scale } = camera;
  world.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
  const cell = Math.max(10, 20 * scale);
  grid.style.backgroundSize = `${cell}px ${cell}px`;
  grid.style.backgroundPosition = `${x % cell}px ${y % cell}px`;
  const percent = `${Math.round(scale * 100)}%`;
  if ($('zoom').textContent !== percent) $('zoom').textContent = percent;
}

function fit() {
  if (!cards.length) return;
  const minX = Math.min(...cards.map(card => card.x));
  const minY = Math.min(...cards.map(card => card.y));
  const width = Math.max(...cards.map(card => card.x + card.node.offsetWidth)) - minX;
  const height = Math.max(...cards.map(card => card.y + card.node.offsetHeight)) - minY;
  const scale = Math.min(1.2, Math.max(45, viewport.clientWidth - 64) / width, Math.max(45, viewport.clientHeight - 98) / height);
  camera = {
    x: (viewport.clientWidth - width * scale) / 2 - minX * scale,
    y: (viewport.clientHeight - height * scale) / 2 - minY * scale - 12,
    scale,
  };
  updateCamera();
}

function zoom(factor, x = viewport.clientWidth / 2, y = viewport.clientHeight / 2) {
  if (!cards.length) return;
  const scale = Math.max(Math.min(.12, camera.scale), Math.min(3, camera.scale * factor));
  camera.x = x - (x - camera.x) * scale / camera.scale;
  camera.y = y - (y - camera.y) * scale / camera.scale;
  camera.scale = scale;
  updateCamera();
}

function updateImages() {
  hideIssue();
  for (const { shot, img, overlays } of cards) {
    const source = markedMode && shot.marked && !shot.issues?.length ? shot.marked : shot.src;
    if (img.getAttribute('src') !== source) img.src = source;
    overlays.hidden = !markedMode || !shot.issues?.length;
  }
  $('toggle-marked').textContent = markedMode ? '원본 보기' : '표시 보기';
  $('toggle-marked').setAttribute('aria-pressed', String(markedMode));
}

function draw() {
  hideIssue();
  world.replaceChildren();
  layer = 0;
  const originals = run?.shots || [];
  const shots = [...originals, ...originals.flatMap(shot => shot.preview ? [{
    ...shot.preview, name: `${shot.name} · 생성 미리보기`, generated: true, original: shot,
  }] : [])];
  cards = [];
  let x = 0, y = 0, rowHeight = 0;
  const previous = run ? readPositions() : {};
  for (const [index, shot] of shots.entries()) {
    const [w, h] = shot.pixels || shot.actual || shot.requested || [720, 480];
    const ratio = w / h;
    const width = Math.min(490, Math.max(195, 350 * ratio));
    const height = Math.min(355, width / ratio);
    const node = document.createElement('figure');
    const img = new Image();
    const media = document.createElement('div');
    const surface = document.createElement('div');
    const overlays = document.createElement('div');
    const caption = document.createElement('figcaption');
    const size = document.createElement('span');
    const info = document.createElement('span');
    const link = document.createElement('a');
    const item = previous?.[shot.src];
    node.className = shot.generated ? 'shot generated' : 'shot';
    node.style.width = `${width + 16}px`;
    node.style.setProperty('--shot-height', `${height}px`);
    node.style.setProperty('--image-width', `${Math.min(width, height * ratio)}px`);
    node.tabIndex = 0;
    img.alt = shot.name;
    img.draggable = false;
    media.className = 'shot-media';
    surface.className = 'shot-surface';
    overlays.className = 'overlays';
    for (const [number, issue] of (shot.issues || []).entries()) {
      const [left, top, boxWidth, boxHeight] = issue.box;
      const marker = document.createElement('button');
      marker.className = 'hotspot';
      marker.setAttribute('aria-label', `${number + 1}. ${issue.problem} 수정 제안: ${issue.suggestion}`);
      marker.style.left = `${left * 100 / w}%`;
      marker.style.top = `${top * 100 / h}%`;
      marker.style.width = `${boxWidth * 100 / w}%`;
      marker.style.height = `${boxHeight * 100 / h}%`;
      const label = document.createElement('span');
      label.textContent = number + 1;
      label.setAttribute('aria-hidden', 'true');
      marker.append(label);
      marker.onpointerenter = marker.onfocus = () => showIssue(marker, issue);
      marker.onpointerleave = marker.onblur = hideIssue;
      marker.onclick = () => openProposals(shot);
      overlays.append(marker);
    }
    surface.append(img, overlays);
    media.append(surface);
    size.className = 'size';
    size.textContent = (shot.original?.actual || shot.actual || shot.requested || shot.pixels)?.join(' × ') || shot.name;
    info.className = 'issue';
    info.textContent = shot.generated ? '생성 미리보기' : shot.issues?.length ? `문제 ${shot.issues.length}건` : shot.mismatch ? '크기 다름' : (shot.marked ? '문제 표시' : '');
    if (shot.mismatch && shot.requested) node.title = `요청 크기 ${shot.requested.join(' × ')}`;
    link.href = shot.src;
    link.target = '_blank';
    link.rel = 'noopener';
    link.textContent = shot.generated ? '이미지 ↗' : '원본 ↗';
    link.setAttribute('aria-label', `${shot.name} 이미지 열기`);
    caption.append(size, info, link);
    node.append(media, caption);
    if (shot.issues?.length || shot.generated) {
      const action = document.createElement('button');
      action.className = 'shot-action';
      action.textContent = shot.generated ? '수정 제안 보기' : '어떻게 변할지 보기';
      action.onclick = () => openProposals(shot.original || shot);
      node.append(action);
    }
    world.append(node);
    const stored = Array.isArray(item) && item.length === 2 && item.every(Number.isFinite);
    const card = { shot, img, overlays, node, x: stored ? item[0] : x, y: stored ? item[1] : y };
    cards.push(card);
    position(card);
    x += width + 38;
    rowHeight = Math.max(rowHeight, node.offsetHeight);
    if (index % 3 === 2) { x = 0; y += rowHeight + 24; rowHeight = 0; }
    node.addEventListener('keydown', (event) => {
      const delta = { ArrowLeft: [-1,0], ArrowRight: [1,0], ArrowUp: [0,-1], ArrowDown: [0,1] }[event.key];
      if (!delta || event.target !== node) return;
      event.preventDefault();
      const step = event.shiftKey ? 30 : 10;
      card.x += delta[0] * step;
      card.y += delta[1] * step;
      position(card);
      savePositions();
    });
  }
  $('run-title').textContent = run?.title || '검사 기록';
  $('meta').textContent = run ? `${run.day} · 스크린샷 ${originals.length}장` : '';
  $('toggle-marked').hidden = !originals.some(shot => shot.marked || shot.issues?.length);
  $('show-notes').hidden = !(run?.findingsPath || run?.report);
  $('canvas-bar').hidden = !shots.length;
  $('empty').hidden = Boolean(shots.length);
  $('empty-title').textContent = run ? '스크린샷이 없어요' : '아직 검사 기록이 없어요';
  $('empty-detail').textContent = run?.error || (run ? '검사 기록에서 결과를 확인할 수 있어요.' : '검증맨으로 화면을 검사하면 여기에 결과가 쌓여요.');
  markedMode = true;
  updateImages();
  fit();
}

function updateProposalControls(error = '') {
  const pending = pendingPreviews.has(proposalShot.src);
  $('generate-preview').disabled = pending || !previewEnabled;
  $('generate-preview').textContent = pending ? '생성 중…' : proposalShot.preview ? '캔버스에서 보기' : '이미지 생성';
  $('copy-fixes').hidden = !proposalShot.preview;
  $('proposal-status').textContent = error || (pending ? 'Codex가 원본과 모든 제안을 바탕으로 이미지를 만들고 있어요.' :
    proposalShot.preview ? '이미지는 수정 후 모습을 가늠하기 위한 시안입니다.' :
    !previewEnabled ? '이미지를 만들려면 dashboard.py를 --serve --open으로 실행하세요.' : '이미지를 만들면 원본과 이 수정 제안이 Codex에 전달됩니다.');
  if (proposalShot.preview && !pending) $('generate-preview').disabled = false;
}

function openProposals(shot) {
  hideIssue();
  proposalShot = shot;
  $('fix-text').hidden = true;
  const entries = shot.issues.map(issue => {
    const item = document.createElement('li');
    const title = document.createElement('strong');
    const detail = document.createElement('p');
    title.textContent = issue.problem;
    detail.textContent = issue.suggestion;
    item.append(title, detail);
    return item;
  });
  $('proposal-list').replaceChildren(...entries);
  updateProposalControls();
  $('proposals').showModal();
}

$('generate-preview').onclick = async () => {
  const shot = proposalShot;
  if (shot.preview) { $('proposals').close(); fit(); return; }
  if (!previewEnabled || pendingPreviews.has(shot.src)) return;
  pendingPreviews.add(shot.src);
  updateProposalControls();
  let error = '';
  try {
    const response = await fetch('preview', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({shot: shot.src}),
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || '이미지를 만들지 못했습니다.');
    shot.preview = data.preview;
    if (run?.shots.includes(shot)) { savePositions(); draw(); }
    if (proposalShot === shot) $('proposals').close();
  } catch (failure) {
    error = failure instanceof SyntaxError || failure instanceof TypeError ? '로컬 관제탑에 연결할 수 없습니다.' : failure.message;
  } finally {
    pendingPreviews.delete(shot.src);
    if (proposalShot === shot) updateProposalControls(error);
  }
};

$('copy-fixes').onclick = async () => {
  const shot = proposalShot;
  const text = [`${run.title} 화면에서 아래 레이아웃 문제를 수정해줘.`, shot.context,
    ...shot.issues.map((issue, i) => `${i + 1}. ${issue.problem}\n   ${issue.suggestion}`)].filter(Boolean).join('\n');
  try {
    await navigator.clipboard.writeText(text);
    $('proposal-status').textContent = '수정 요청을 복사했어요.';
  } catch {
    $('fix-text').value = text;
    $('fix-text').hidden = false;
    $('fix-text').focus();
    $('fix-text').select();
  }
};

function select(item) {
  run = item;
  day = item.day;
  calendar();
  list();
  draw();
}

$('prev').onclick = () => { month.setMonth(month.getMonth() - 1); calendar(); };
$('next').onclick = () => { month.setMonth(month.getMonth() + 1); calendar(); };
$('toggle-marked').onclick = () => { markedMode = !markedMode; updateImages(); };
$('show-notes').onclick = () => {
  for (const [id, path] of [['report',run.report], ['findings',run.findingsPath]]) {
    const link = $(id);
    link.hidden = !path;
    if (path) link.href = path;
  }
  $('notes-text').textContent = run.findings || run.error || '측정 결과는 JSON 파일에서 확인할 수 있어요.';
  $('notes').showModal();
};
$('zoom-in').onclick = () => zoom(1.25);
$('zoom-out').onclick = () => zoom(.8);
$('fit').onclick = fit;

viewport.addEventListener('pointerdown', event => {
  if (drag || !cards.length || (event.button !== 0 && event.button !== 1) || event.target.closest('button,a,.empty,.canvas-bar')) return;
  const view = event.target.closest('.shot');
  hideIssue();
  const card = event.button === 0 ? cards.find(item => item.node === view) : null;
  if (card) card.node.style.zIndex = ++layer;
  drag = {
    id: event.pointerId, card,
    clientX: event.clientX, clientY: event.clientY,
    x: card ? card.x : camera.x, y: card ? card.y : camera.y,
  };
  viewport.setPointerCapture(event.pointerId);
  viewport.classList.add('moving');
});

viewport.addEventListener('pointermove', event => {
  if (drag?.id !== event.pointerId) return;
  const dx = event.clientX - drag.clientX, dy = event.clientY - drag.clientY;
  if (drag.card) {
    drag.card.x = drag.x + dx / camera.scale;
    drag.card.y = drag.y + dy / camera.scale;
    position(drag.card);
  } else {
    camera.x = drag.x + dx;
    camera.y = drag.y + dy;
    updateCamera();
  }
});

for (const name of ['pointerup', 'pointercancel', 'lostpointercapture']) {
  viewport.addEventListener(name, event => {
    if (drag?.id !== event.pointerId) return;
    if (drag.card) savePositions();
    drag = null;
    viewport.classList.remove('moving');
  });
}

viewport.addEventListener('wheel', event => {
  if (!cards.length || drag || event.target.closest('.canvas-bar')) return;
  event.preventDefault();
  if (event.ctrlKey || event.metaKey) {
    const bounds = viewport.getBoundingClientRect();
    zoom(Math.exp(-event.deltaY * .012), event.clientX - bounds.left, event.clientY - bounds.top);
  } else {
    const unit = event.deltaMode === 1 ? 16 : event.deltaMode === 2 ? viewport.clientHeight : 1;
    camera.x -= (event.shiftKey && !event.deltaX ? event.deltaY : event.deltaX) * unit;
    camera.y -= (event.shiftKey && !event.deltaX ? 0 : event.deltaY) * unit;
    updateCamera();
  }
}, { passive:false });

$('project').textContent = project;
calendar();
list();
draw();
window.addEventListener('resize', () => {
  if (!drag) fit();
});
</script>
</body>
</html>
